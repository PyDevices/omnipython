# The type stubs under lib/, utils/ and the palettes, iconkit and pdwidgets packages: mypy reads every .pyi, and stubtest imports each
# module under CPython and fails when its stub and the code disagree about a
# name or a signature. Runs when a stub, the code it describes or this file changes.
name: Stubs

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'utils/**'
      - 'packages/palettes/lib/**'
      - 'packages/iconkit/lib/**'
      - 'packages/pdwidgets/lib/**'
      - 'packages/midiports/**'
      - 'tools/check_stubs.py'
      - 'tools/stubs/**'
      - '.github/workflows/stubs.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'utils/**'
      - 'packages/palettes/lib/**'
      - 'packages/iconkit/lib/**'
      - 'packages/pdwidgets/lib/**'
      - 'packages/midiports/**'
      - 'tools/check_stubs.py'
      - 'tools/stubs/**'
      - '.github/workflows/stubs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install SDL runtime
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
      # stubtest imports each module, and the libraries import these.
      - run: >
          python -m pip install mypy pillow numpy ipython bleak zeroconf resvg-py
          -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/
          omnipython-lvgl "omnipython-pygraphics>=0.1.7.dev0"
      - name: mypy over every stub, then stubtest over each module that imports under CPython
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/check_stubs.py
