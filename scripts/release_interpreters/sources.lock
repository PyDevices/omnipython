# The sources a release's interpreters are built from: name, git URL,
# full commit. A release's interpreters are what people download, so they build
# from exactly these commits, never from a branch tip. Full 40-character
# SHAs: GitHub serves a fetch by commit only for the whole hash.
#
#   omnipython-builds   build_mp.py, its patches, and its own locks: the
#                           MicroPython commit, the toolchains, and every module;
#                           the library (OmniPython, palettes, pdwidgets) is the
#                           release's tag
#   omnipython-lvgl         LVGL and its bindings, whose ports/circuitpython the
#                           CircuitPython build compiles
#
# To move them to the current tips of their default branches, run
#   python3 scripts/release_interpreters/sources.py bump
# and commit the result. docs/publishing.md has the rest.
omnipython-builds   https://github.com/PyDevices/omnipython-builds.git   7c9456de1a9815ffdb9101cbbbf18e7c3ac433cb
omnipython-lvgl         https://github.com/PyDevices/omnipython-lvgl.git         fb0343d4d588b0151e17298f2f456a5d9e361022
